services:
  mdcng:
    image: mdcng/mdc:latest
    container_name: mdcng
    hostname: ${HOSTNAME}
    network_mode: host
    environment:
      - MDC_USERNAME=${MDC_USERNAME}
      - MDC_PASSWORD=${MDC_PASSWORD}
      - TZ=${TZ}
      - PGID=${PGID}
      - PUID=${PUID}
      - NODE_VERSION=22.22.0
      - YARN_VERSION=1.22.22
      - MDC_CONFIG_PATH=/config/config.json
      - OPENSSL_CONF=/etc/openssl.cnf
    volumes:
      - ${MDC_AV_PATH}:/AV
      - ${MDC_AV_SCRAPE_PATH}:/AV_Scrape
      - ${MDC_PORN_GIRL_PATH}:/porn_girl
      - ${MDC_FC2_PATH}:/FC2
      - ${MDC_FC2_SCRAPE_PATH}:/FC2_Scrape
      - ${MDC_CONFIG_HOST_PATH}:/config
      - ${MDC_PORN_GIRL_SCRAPE_PATH}:/porn_girl_Scrape
      - ${MDC_PORN_TRAN_PATH}:/porn_tran
      - ${MDC_PORN_TRAN_SCRAPE_PATH}:/porn_tran_Scrape
    restart: unless-stopped
    entrypoint: ["entrypoint.sh"]
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
